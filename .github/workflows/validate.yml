name: MadOS ROG — CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax — install.sh
        run: bash -n install.sh

      - name: Check syntax — lib/
        run: |
          for f in lib/*.sh; do
            echo "→ bash -n $f"
            bash -n "$f"
          done

      - name: Check syntax — modules/
        run: |
          for f in modules/*.sh; do
            echo "→ bash -n $f"
            bash -n "$f"
          done

      - name: Check syntax — tools/
        run: |
          for f in tools/*.sh; do
            echo "→ bash -n $f"
            bash -n "$f"
          done

  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck -S warning -e SC2034,SC2155,SC1091 install.sh || true

      - name: Lint lib/
        run: |
          for f in lib/*.sh; do
            echo "→ $f"
            shellcheck -S warning -e SC2034,SC2155,SC1091 "$f" || true
          done

      - name: Lint modules/
        run: |
          for f in modules/*.sh; do
            echo "→ $f"
            shellcheck -S warning -e SC2034,SC2155,SC1091 "$f" || true
          done

      - name: Lint tools/
        run: |
          for f in tools/*.sh; do
            echo "→ $f"
            shellcheck -S warning -e SC2034,SC2155,SC1091 "$f" || true
          done

  structure:
    name: Project Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          fail=0
          for f in install.sh lib/common.sh VERSION tools/mados.sh tools/mados_completion.sh; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              fail=1
            fi
          done
          exit $fail

      - name: Verify module count
        run: |
          count=$(ls modules/*.sh 2>/dev/null | wc -l)
          echo "Modules trouvés : $count"
          [ "$count" -ge 30 ] || { echo "✗ Moins de 30 modules détectés !"; exit 1; }
