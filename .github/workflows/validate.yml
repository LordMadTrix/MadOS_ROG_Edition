name: MadOS ROG — Validation Scripts Bash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntaxe:
    name: Syntaxe Bash (bloquant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ce controle est le garde-fou principal : il aurait bloque les deux
      # erreurs de syntaxe parties en production (06_thematique_mados.sh et
      # 02_pilotes_gpu_auto.sh). Il DOIT rester bloquant -- pas de "|| true".
      - name: Analyse syntaxique de tous les scripts
        run: |
          echec=0
          for script in install.sh lib/*.sh modules/*.sh; do
            [ -f "$script" ] || continue
            if bash -n "$script" 2>/tmp/err; then
              echo "OK    $script"
            else
              echo "ECHEC $script"
              sed 's/^/        /' /tmp/err
              echec=1
            fi
          done
          if [ "$echec" -ne 0 ]; then
            echo "::error::Au moins un script ne passe pas l'analyse syntaxique Bash."
            exit 1
          fi
          echo "Tous les scripts passent bash -n."

      # Un module reference par install.sh mais absent du depot casse
      # l'installation en silence (cas install_local.sh). On verifie donc que
      # chaque module appele existe reellement.
      - name: Verifier que les modules appeles existent
        run: |
          echec=0
          for module in $(grep -oE 'run_module "[^"]+"' install.sh | cut -d'"' -f2 | sort -u); do
            if [ -f "modules/$module" ]; then
              echo "OK    modules/$module"
            else
              echo "ECHEC modules/$module est appele par install.sh mais n'existe pas"
              echec=1
            fi
          done
          if [ "$echec" -ne 0 ]; then
            echo "::error::install.sh appelle un module absent du depot."
            exit 1
          fi

      # lib/config.conf declarait 58 reglages dont 48 que personne ne lisait :
      # changer DNS_PRIMARY ou XANMOD_FLAVOR n'avait aucun effet, et rien ne le
      # disait. Meme defaut que la sauvegarde qui ne sauvegardait rien. Ce
      # controle refuse tout reglage qui ne pilote rien.
      - name: Chaque reglage de config.conf pilote-t-il quelque chose ?
        run: |
          if ! bash tools/test_config.sh; then
            echo "::error::lib/config.conf declare des reglages que le code ne lit pas. Cablez-les ou retirez-les."
            exit 1
          fi

  shellcheck:
    name: ShellCheck (bloquant)
    runs-on: ubuntu-latest
    # Bloquant. Le code est propre : toute nouvelle alerte doit etre traitee,
    # pas accumulee. SC1091 reste exclu car ShellCheck ne peut pas suivre un
    # `source` dont le chemin est une variable ($PROJECT_ROOT/lib/common.sh) :
    # c'est un faux positif structurel, pas un defaut.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint install.sh, lib/, modules/ et tools/
        run: shellcheck -S warning -e SC1091 install.sh lib/*.sh modules/*.sh tools/*.sh

  pages:
    name: GitHub Pages — Verify index.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # La page vit dans docs/, pas a la racine : c'est de la que GitHub Pages la
      # sert (source = branche main, chemin /docs).
      - name: Check docs/index.html exists
        run: |
          if [ ! -f docs/index.html ]; then
            echo "::error::docs/index.html is missing!"
            exit 1
          fi
          echo "docs/index.html is present"

      - name: Validate HTML structure
        run: |
          grep -q "<title>" docs/index.html || { echo "::error::No title tag"; exit 1; }
          grep -q "git clone" docs/index.html || { echo "::error::La page ne propose pas la methode d'installation par git clone"; exit 1; }
          echo "Structure de la page OK"
