# ==============================================================================
# MadOS ROG Edition - Configuration Globale
# ==============================================================================
# Charge par install.sh juste apres lib/common.sh.
#
# REGLE DE CE FICHIER : chaque reglage present ici PILOTE REELLEMENT quelque
# chose. Si vous modifiez une valeur, le comportement change.
#
# Ce n'etait pas le cas avant : le fichier declarait 58 reglages dont 48 que
# personne ne lisait. Changer DNS_PRIMARY, XANMOD_FLAVOR ou REQUIRED_RAM
# n'avait aucun effet, et rien ne le disait. C'est le meme defaut que la
# sauvegarde qui ne sauvegardait rien : une promesse que le code ne tient pas.
#
# tools/test_config.sh verifie cette regle et echoue si un reglage inerte
# reapparait.
# ==============================================================================

# ==============================================================================
# Chemins & repertoires
# ==============================================================================
MADOS_LOG_DIR="${MADOS_LOG_DIR:-/var/log/mados}"
MADOS_BACKUP_DIR="${MADOS_BACKUP_DIR:-/var/lib/mados_backup}"
MADOS_CHECKPOINT_FILE="${MADOS_CHECKPOINT_FILE:-/tmp/mados_checkpoint.log}"
MADOS_BACKUP_MANIFEST="${MADOS_BACKUP_MANIFEST:-$MADOS_BACKUP_DIR/manifeste.tsv}"
MADOS_ERRORS_FILE="${MADOS_ERRORS_FILE:-$MADOS_LOG_DIR/mados_errors.log}"

# ==============================================================================
# Pre-requis materiels et systeme
# ==============================================================================

# Versions d'Ubuntu sur lesquelles MadOS a ete teste.
# Hors de ces bornes : un AVERTISSEMENT, jamais un refus. Bloquer rendrait le
# script inutilisable des la sortie de la LTS suivante.
UBUNTU_MIN_VERSION="24.04"
UBUNTU_MAX_VERSION="26.04"

# Espace disque, en Go.
#   REQUIRED    = plancher BLOQUANT. Reste a 10, la valeur que le code
#                 appliquait deja : brancher ce fichier ne doit pas durcir en
#                 silence une barriere qui laissait passer avant.
#   RECOMMENDED = seuil d'AVERTISSEMENT, non bloquant.
REQUIRED_DISK_SPACE="10"
RECOMMENDED_DISK_SPACE="40"

# Memoire vive en Go. Avertissement seulement : une machine en dessous peut
# installer MadOS, elle compilera simplement plus lentement.
REQUIRED_RAM="4"

# ==============================================================================
# Reseau
# ==============================================================================

# DNS de secours, injectes uniquement si archive.ubuntu.com est injoignable.
DNS_PRIMARY="8.8.8.8"
DNS_SECONDARY="1.1.1.1"
DNS_TERTIARY="8.8.4.4"

# Delai d'attente des tests de connectivite, en secondes.
PING_TIMEOUT="3"

# Ecrits dans /etc/apt/apt.conf.d/99mados-network.
APT_TIMEOUT="30"
APT_RETRIES="5"

# ==============================================================================
# Tentatives et reprises
# ==============================================================================

# Utilises par run_command_retry() dans lib/common.sh.
RETRY_COUNT="3"
RETRY_DELAY="5"

# ==============================================================================
# Noyau
# ==============================================================================

# Saveur XanMod : edge (recent), lts (stable), rt (temps reel), tt.
# Le paquet installe devient linux-xanmod-<saveur>-<niveau CPU detecte>.
# Une valeur inconnue retombe sur edge, avec un avertissement.
XANMOD_FLAVOR="edge"

# ==============================================================================
# Instantanes systeme
# ==============================================================================

# Commentaire attache aux instantanes Timeshift crees par le module 07.
SNAPSHOT_COMMENT="Sauvegarde MadOS Initiale"

# ==============================================================================
# Mise a jour
# ==============================================================================

# Depot interroge par le module 24. Un fork n'a que cette ligne a changer.
MADOS_REPO_URL="https://github.com/LordMadTrix/MadOS_ROG_Edition.git"

# ==============================================================================
# Mode simulation
# ==============================================================================

# Affiche ce qui serait fait, sans rien ecrire. Equivalent de --dry-run.
DRY_RUN="${DRY_RUN:-no}"

# ==============================================================================
# CE QUI N'EST PAS REGLABLE, ET POURQUOI
# ==============================================================================
# Les reglages suivants existaient ici sans que rien ne les lise. Ils sont
# retires plutot que laisses en decor : un bouton qui ne fait rien est pire
# qu'un bouton absent, parce qu'on croit s'en etre servi.
#
#   MODULES_MANDATORY / MODULES_OPTIONAL
#       La liste qui fait foi est la checklist de install.sh. En garder une
#       copie ici garantissait qu'elles divergent un jour.
#
#   SERVICES_TO_ENABLE / SERVICES_TO_DISABLE / PPA_LIST / CRITICAL_FILES
#       Chaque module declare ce dont il a besoin, la ou il s'en sert.
#
#   HYPERVISORS_SUPPORTED, QEMU/VMWARE/VIRTUALBOX/HYPERV_PACKAGES
#       modules/hyperviseur_drivers.sh porte ses propres listes.
#
#   KDE_VERSION, PYTHON_VERSION, NODE_VERSION, ELECTRON_VERSION, DOCKER_VERSION
#       De la documentation, pas des reglages : changer un numero ici
#       n'installerait pas une autre version.
#
#   TDP_PROFILE_*, THERMAL_LIMIT_C
#       Les profils thermiques se pilotent depuis « mados shift », pas d'ici.
#
#   LOG_LEVEL, LOG_TO_SYSLOG, LOG_RETENTION_DAYS, DETAILED_ERROR_LOGGING,
#   STOP_ON_ERROR, DEBUG_MODE, FORCE_REINSTALL, APT_MIRROR, MADOS_ROOT_DIR
#       Jamais implementes. A remettre le jour ou ils le seront, pas avant.
#
#   SEND_ERRORS_REMOTE / ERRORS_REMOTE_URL
#       Retires avec insistance : MadOS n'envoie RIEN nulle part. Laisser un
#       reglage qui suggere le contraire est trompeur, meme regle sur "no".
# ==============================================================================

export MADOS_LOG_DIR MADOS_BACKUP_DIR MADOS_CHECKPOINT_FILE MADOS_ERRORS_FILE
export RETRY_COUNT RETRY_DELAY
export APT_TIMEOUT APT_RETRIES PING_TIMEOUT
export DNS_PRIMARY DNS_SECONDARY DNS_TERTIARY
export XANMOD_FLAVOR SNAPSHOT_COMMENT MADOS_REPO_URL
