# ==============================================================================
# MadOS ROG Edition 3.0 - Configuration Globale
# ==============================================================================
# Ce fichier contient tous les paramètres centralisés pour l'installation
# ==============================================================================

# ==============================================================================
# Chemins & Répertoires
# ==============================================================================

# Répertoire racine de MadOS
MADOS_ROOT_DIR="${MADOS_ROOT_DIR:-/opt/mados}"

# Dossiers logs et backups
MADOS_LOG_DIR="${MADOS_LOG_DIR:-/var/log/mados}"
MADOS_BACKUP_DIR="${MADOS_BACKUP_DIR:-/var/lib/mados_backup}"
MADOS_CHECKPOINT_FILE="${MADOS_CHECKPOINT_FILE:-/tmp/mados_checkpoint.log}"
MADOS_BACKUP_MANIFEST="${MADOS_BACKUP_MANIFEST:-$MADOS_BACKUP_DIR/manifeste.tsv}"
MADOS_ERRORS_FILE="${MADOS_ERRORS_FILE:-$MADOS_LOG_DIR/mados_errors.log}"

# ==============================================================================
# Paramètres d'Installation
# ==============================================================================

# Versión d'Ubuntu supportée
UBUNTU_MIN_VERSION="24.04"
UBUNTU_MAX_VERSION="25.10"

# Espace disque requis (en GB)
REQUIRED_DISK_SPACE="40"

# RAM requise (en GB)
REQUIRED_RAM="4"

# ==============================================================================
# Paramètres Réseau & APT
# ==============================================================================

# Serveurs DNS de secours
DNS_PRIMARY="8.8.8.8"
DNS_SECONDARY="1.1.1.1"
DNS_TERTIARY="8.8.4.4"

# Miroir APT global (au lieu de miroirs régionaux)
APT_MIRROR="http://archive.ubuntu.com/ubuntu"

# Timeouts réseau (en secondes)
APT_TIMEOUT="30"
APT_RETRIES="5"
PING_TIMEOUT="3"

# ==============================================================================
# Configuration des Hyperviseurs
# ==============================================================================

# Détection et installation automatique des drivers
ENABLE_HYPERVISOR_DETECTION="yes"

# Hyperviseurs supportés
HYPERVISORS_SUPPORTED=(
    "qemu"
    "vmware"
    "virtualbox"
    "hyperv"
)

# Packages QEMU
QEMU_PACKAGES=(
    "qemu-guest-agent"
    "spice-vdagent"
    "acpid"
    "open-vm-tools"
)

# Packages VMware
VMWARE_PACKAGES=(
    "open-vm-tools"
    "open-vm-tools-desktop"
    "open-vm-tools-devel"
    "build-essential"
    "linux-headers-generic"
)

# Packages VirtualBox
VIRTUALBOX_PACKAGES=(
    "virtualbox-guest-utils"
    "virtualbox-guest-x11"
    "virtualbox-guest-dkms"
    "build-essential"
    "linux-headers-generic"
)

# Packages Hyper-V
HYPERV_PACKAGES=(
    "linux-image-generic"
    "linux-tools-generic"
    "build-essential"
)

# ==============================================================================
# Paramètres Retry & Gestion d'Erreurs
# ==============================================================================

# Nombre de tentatives par défaut
RETRY_COUNT="3"
RETRY_DELAY="5"  # en secondes

# Nombre de tentatives pour apt
APT_RETRY_COUNT="5"

# ==============================================================================
# Dépendances & Versions de Paquets
# ==============================================================================

# Noyau XanMod
XANMOD_FLAVOR="edge"  # Options: edge, rt, tt, lts

# KDE Plasma
KDE_VERSION="6"

# Python
PYTHON_VERSION="3.12"

# Node.js (pour OpenClaw)
NODE_VERSION="20"

# Versions des outils clés
ELECTRON_VERSION="40.8.0"
DOCKER_VERSION="latest"

# ==============================================================================
# Profils Thermiques
# ==============================================================================

# TDP Profiles (définit par l'utilisateur dans le menu)
TDP_PROFILE_SILENCE="25"
TDP_PROFILE_EQUILIBRE="45"
TDP_PROFILE_EXTREME="65"

# Température limite pour thermal throttling
THERMAL_LIMIT_C="85"

# ==============================================================================
# Modules à Installer
# ==============================================================================

# Modules obligatoires (toujours exécutés)
MODULES_MANDATORY=(
    "00_nettoyage_ubuntu"
    "01_noyau_xanmod"
    "02_pilotes_gpu_auto"
    "03_integration_rog"
    "04_arsenal_logiciel"
    "05_bureau_kde_plasma"
    "06_thematique_mados"
)

# Modules optionnels (déterminés par l'utilisateur)
# Les codes courts utilisés dans le menu
MODULES_OPTIONAL=(
    "SNAP:07_snapshots_systeme"
    "PROT:08_proton_gamescope"
    "NTFS:09_montage_ntfs"
    "SOND:10_son_demarrage"
    "BATT:11_batterie_extreme"
    "MANG:12_mangohud_rog"
    "STRM:13_pack_streamer"
    "CLAW:14_openclaw_ai"
    "NET:15_reseau_antilag"
    "ZRAM:16_zram_memoire"
    "ADS:17_bouclier_antipub"
    "DEV:18_pack_pro_dev"
    "SSD:19_donnees_fstrim"
    "USB:20_esport_usb_1000hz"
    "BOOT:21_boot_eclair"
    "VOLT:22_cpu_undervolt"
    "GUI:23_control_center"
    "UPD:24_mados_update"
    "SAN:25_sante_systeme"
    "VR:26_vr_oculus_quest"
    "MAK:27_creation_maker"
)

# ==============================================================================
# Couleurs ANSI pour Terminal
# ==============================================================================

# Ces variables sont importées depuis lib/common.sh
# mais sont définies ici pour référence:

# RED='\033[0;31m'
# GREEN='\033[0;32m'
# CYAN='\033[0;36m'
# WHITE='\033[1;37m'
# GRAY='\033[0;37m'
# YELLOW='\033[0;33m'
# BOLD='\033[1m'
# NC='\033[0m'

# ==============================================================================
# URLs & Ressources Externes
# ==============================================================================

# Repository GitHub
MADOS_REPO_URL="https://github.com/LordMadTrix/MadOS_ROG_Edition.git"
MADOS_RELEASES_URL="https://api.github.com/repos/LordMadTrix/MadOS_ROG_Edition/releases/latest"

# Dépôts APT supplémentaires
PPA_LIST=(
    "ppa:kubuntu-ppa/backports"
    "ppa:graphics-drivers/ppa"
)

# ==============================================================================
# Services Systemd
# ==============================================================================

# Services à démarrer au boot
SERVICES_TO_ENABLE=(
    "mados-control-center"
    "openclaw"
    "auto-cpufreq"
)

# Services à arrêter
SERVICES_TO_DISABLE=(
    "snapd"
    "apport"
)

# ==============================================================================
# Fichiers de Configuration Critiques
# ==============================================================================

# Fichiers à toujours sauvegarder avant modification
CRITICAL_FILES=(
    "/etc/apt/sources.list"
    "/etc/apt/sources.list.d/ubuntu.sources"
    "/etc/netplan/50-cloud-init.yaml"
    "/etc/resolv.conf"
    "/etc/grub.d/40_custom"
    "/etc/modprobe.d/blacklist.conf"
)

# ==============================================================================
# Logging & Debugging
# ==============================================================================

# Niveau de verbosité
# Options: SILENT, ERROR, WARNING, INFO, DEBUG, VERBOSE
LOG_LEVEL="${LOG_LEVEL:-INFO}"

# Enregistrer tous les logs aussi dans syslog?
LOG_TO_SYSLOG="yes"

# Conserver les logs pendant combien de jours
LOG_RETENTION_DAYS="30"

# ==============================================================================
# Timeshift (Snapshots Système)
# ==============================================================================

# Créer un snapshot avant l'installation?
CREATE_SNAPSHOT_BEFORE="yes"

# Créer un snapshot après l'installation?
CREATE_SNAPSHOT_AFTER="yes"

# Commentaire pour les snapshots
SNAPSHOT_COMMENT="MadOS Installation Checkpoint"

# ==============================================================================
# Comportement d'Erreur
# ==============================================================================

# Arrêter à la première erreur? (set -e)
STOP_ON_ERROR="no"

# Enregistrer les détails d'erreur complètement?
DETAILED_ERROR_LOGGING="yes"

# Envoyer les logs d'erreur à un serveur distant?
SEND_ERRORS_REMOTE="no"
ERRORS_REMOTE_URL="${ERRORS_REMOTE_URL:-}"

# ==============================================================================
# Paramètres Avancés
# ==============================================================================

# Exécuter en mode simulation (dry-run)?
DRY_RUN="${DRY_RUN:-no}"

# Forcer la réinstallation même si déjà complété?
FORCE_REINSTALL="${FORCE_REINSTALL:-no}"

# Activer le débogage (bash -x)?
DEBUG_MODE="${DEBUG_MODE:-no}"

# ==============================================================================
# Export pour Sous-Scripts
# ==============================================================================

export MADOS_ROOT_DIR MADOS_LOG_DIR MADOS_BACKUP_DIR
export MADOS_CHECKPOINT_FILE MADOS_ERRORS_FILE
export RETRY_COUNT RETRY_DELAY
export APT_MIRROR APT_TIMEOUT APT_RETRIES
